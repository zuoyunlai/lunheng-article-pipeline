name: 论衡算法测试 CI（v2.5.6 新增，第三方独立审查建议 #1）

# CI 集成：PR + master push 自动跑 M 门 13 项算法格式测试
# 用途：拦截「改 A 漏 B」导致的算法字段变更、fixture 失效、M 门误判

on:
  pull_request:
    paths:
      - 'references/_shared/M-Gate-Algorithm.md'
      - 'references/_shared/audit-checklist-quickref.md'
      - 'references/_shared/字数判定表.md'
      - 'references/gates/14-中文AI痕迹-gate.md'
      - 'references/agents/09-审稿-peer-reviewer.md'
      - 'references/checkers/中文AI痕迹-checker.md'
      - 'references/templates/审稿报告-template.md'
      - 'tests/**'
      - 'scripts/**'
      - 'references/_shared/phase-order.yaml'
  push:
    branches: [master]

jobs:
  test-m-gate-format:
    runs-on: ubuntu-latest
    name: M 门 13 项算法格式测试
    steps:
      - uses: actions/checkout@v5
      
      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-test.txt
      
      - name: 跑 M 门 13 项测试
        run: |
          echo "=========================================="
          echo "论衡 M 门 13 项算法格式测试"
          echo "=========================================="
          python -m pytest tests/test_m_gate.py -q
        env:
          # 注：当前 v2.5.6 不依赖真实 LLM API key（仅 fixture 格式检查）
          # v2.6.0 Phase 2 将集成真实 LLM 调用（需 OPENAI_API_KEY）
          PYTHONPATH: ${{ github.workspace }}

      - name: 跑 T9 + G14 规则一致性测试（v2.5.12 新增，回应审计 P1-3）
        run: |
          echo "=========================================="
          echo "论衡 T9 + G14 规则一致性测试"
          echo "=========================================="
          python -m pytest tests/test_rules_consistency.py -q
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: 跑权限口径 + 流程图真源测试（v2.12.30 新增，回应审计 P0-1/P0-2/P0-3）
        run: |
          echo "=========================================="
          echo "论衡 权限口径 + 流程图真源测试"
          echo "=========================================="
          python -m pytest tests/test_capability_assert.py tests/test_flow_check.py -q
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: 测试结果汇总
        if: always()
        run: |
          echo "=========================================="
          echo "测试完成（详见上文日志）"
          echo "=========================================="

  test-version-sync:
    runs-on: ubuntu-latest
    name: 版本号同步检查
    steps:
      - uses: actions/checkout@v5
      - name: 跑 check-version.sh
        run: |
          chmod +x scripts/check-version.sh
          bash scripts/check-version.sh

  test-self-audit-gate:
    runs-on: ubuntu-latest
    name: 自审门验证
    steps:
      - uses: actions/checkout@v5
      - name: 跑 self-audit-gate.sh
        run: |
          chmod +x scripts/self-audit-gate.sh
          bash scripts/self-audit-gate.sh

  test-official-validate:
    # v2.12.37 新增，回应全量审计 P0-1：项目自审 25 门全绿但官方校验器直接拒收
    # （description 含尖括号）—— 入口文档能否被平台加载必须由官方校验器说了算。
    runs-on: ubuntu-latest
    name: 官方 SKILL.md 校验（quick_validate.py）
    steps:
      - uses: actions/checkout@v5
      - name: 安装 openclaw（取官方 skill-creator 校验器）
        run: npm i -g openclaw --silent
      - name: 跑官方 quick_validate.py
        run: |
          QV="$(npm root -g)/openclaw/skills/skill-creator/scripts/quick_validate.py"
          test -f "$QV"
          python3 "$QV" .
      - name: 自审门（强制要求校验器存在）
        run: |
          chmod +x scripts/self-audit-gate.sh
          LUNHENG_REQUIRE_QUICK_VALIDATE=1 bash scripts/self-audit-gate.sh
