name: 论衡算法测试 CI（v2.5.6 新增，第三方独立审查建议 #1）

# CI 集成：PR + master push 自动跑 M 门 13 项算法格式测试
# 用途：拦截「改 A 漏 B」导致的算法字段变更、fixture 失效、M 门误判

on:
  pull_request:
    paths:
      - 'references/_shared/真源/M-Gate-核心.md'
      - 'references/_shared/真源/audit-checklist-quickref.md'
      - 'references/_shared/真源/字数判定表.md'
      - 'references/gates/14-中文AI痕迹-gate.md'
      - 'references/agents/09-审稿-peer-reviewer.md'
      - 'references/checkers/中文AI痕迹-checker.md'
      - 'references/templates/审稿报告-template.md'
      - 'tests/**'
      - 'scripts/**'
      - 'references/_shared/真源/phase-order.yaml'
      - 'references/**'
      - 'SKILL.md'
  push:
    branches: [master]

jobs:
  test-m-gate-format:
    runs-on: ubuntu-latest
    name: M 门 13 项算法格式测试
    steps:
      - uses: actions/checkout@v5
      
      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      
      - name: 安装依赖（两份锁定文件全装）
        # v2.12.62 后补（教训 #430）：原步骤**只装 tests/requirements-test.txt**，而该文件
        #   当时并未声明 pyyaml ⇒ 下方新步骤 collection 阶段直接 ModuleNotFoundError。
        #   同一份代码在 quality.yml（装两份）下是绿的 ⇒ **绿灯幻觉**：红的那条没人点开。
        #   现口径与 quality.yml / 门 N「两份锁定文件」一致：两份全装。
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r tests/requirements-test.txt
      
      - name: 跑 M 门 13 项测试
        run: |
          echo "=========================================="
          echo "论衡 M 门 13 项算法格式测试"
          echo "=========================================="
          python -m pytest tests/test_m_gate.py -q
        env:
          # 注：当前 v2.5.6 不依赖真实 LLM API key（仅 fixture 格式检查）
          # v2.6.0 Phase 2 将集成真实 LLM 调用（需 OPENAI_API_KEY）
          PYTHONPATH: ${{ github.workspace }}

      - name: 跑 T9 + G14 规则一致性测试（v2.5.12 新增，回应审计 P1-3）
        run: |
          echo "=========================================="
          echo "论衡 T9 + G14 规则一致性测试"
          echo "=========================================="
          python -m pytest tests/test_rules_consistency.py -q
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: 跑权限口径 + 流程图真源测试（v2.12.30 新增，回应审计 P0-1/P0-2/P0-3）
        run: |
          echo "=========================================="
          echo "论衡 权限口径 + 流程图真源测试"
          echo "=========================================="
          python -m pytest tests/test_capability_assert.py tests/test_flow_check.py -q
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: 跑 path-canonical 边界测试
        run: bash scripts/test-path-canonical.sh

      - name: 测试结果汇总
        if: always()
        run: |
          echo "=========================================="
          echo "测试完成（详见上文日志）"
          echo "=========================================="

  test-full-suite:
    # 2026-10-03（CI 收口提速）：原「跑全量测试」由**单个 job 串行**改为 4 路分片并行。
    #   依据（实测，非估算）：run 37121582498 中「跑全量测试」步 829s（该 job 861s 的 96%）；
    #   run 37121582571 中 quality.yml 的 Run pytest 步 1308s（该 job 的 99.2%，其余步骤合计 11s）。
    #   pyproject [tool.pytest.ini_options] 已记录分布：全量 690 项中约 470s = 12 个测试文件对
    #   self-audit-gate.sh 的 49 次 subprocess 调用（每次约 9-10s）。
    #   分片口径：按**测试文件名**轮转（模块不跨片，测试内部状态假设不变）；文件清单运行时用
    #   `ls tests/test_*.py` 动态取 ⇒ 新增测试文件自动进片，不依赖手写清单（防「新测试永不进
    #   CI」复现，见 tests/test_ci_config.py 教训 #430）。
    #   命令仍是 `python -m pytest tests/ -q`（非本片文件用 --ignore 排除）⇒ 4 片并集 = tests/ 全量，
    #   且 test_ci_config.py 的「必须跑全量 tests/」字面不变量继续成立。
    runs-on: ubuntu-latest
    name: 全量测试分片 ${{ matrix.shard }}/4
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      SHARDS: '4'
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v5

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 安装依赖（两份锁定文件全装）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r tests/requirements-test.txt

      - name: 跑全量测试分片（${{ matrix.shard }}/4）
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -eo pipefail
          mapfile -t FILES < <(ls tests/test_*.py | sort)
          echo "tests/ 全量文件数：${#FILES[@]}"
          ARGS=()
          for i in "${!FILES[@]}"; do
            if [ $(( i % SHARDS )) -ne $(( SHARD - 1 )) ]; then
              ARGS+=("--ignore=${FILES[$i]}")
            fi
          done
          echo "分片 ${SHARD}/${SHARDS} 认领 $(( ${#FILES[@]} - ${#ARGS[@]} )) 个测试文件"
          if [ "$(( ${#FILES[@]} - ${#ARGS[@]} ))" -eq 0 ]; then
            echo "::error::分片 ${SHARD} 为空（分片配置错误）—— 拒绝静默通过"
            exit 1
          fi
          python -m pytest tests/ -q --tb=short --durations=15 "${ARGS[@]}"

      - name: 测试结果汇总
        if: always()
        run: |
          echo "=========================================="
          echo "分片测试完成（详见上文日志）"
          echo "=========================================="
  test-version-sync:
    runs-on: ubuntu-latest
    name: 版本号同步检查
    steps:
      - uses: actions/checkout@v5
      - name: 跑 check-version.sh
        run: |
          chmod +x scripts/check-version.sh
          bash scripts/check-version.sh

  test-self-audit-gate:
    runs-on: ubuntu-latest
    name: 自审门验证
    steps:
      - uses: actions/checkout@v5

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 安装依赖（两份锁定文件全装，门 AB 真源需要 pytest）
        # v2.14.4 后补（教训 #430 同族·假绿灯）：原 job 只 checkout + chmod + bash
        #   scripts/self-audit-gate.sh，未装 tests/requirements-test.txt；自审门内
        #   门 AB 调用 `python3 -m pytest tests/test_audit_residuals.py::...`（脚本
        #   行 236-252 注释明确 fail-closed：缺 pytest 不得 SKIP）⇒ CI ubuntu-latest
        #   自带 python3 但无 pytest ⇒ `No module named pytest` ⇒ 门 AB 红、
        #   test-self-audit-gate 与 test-official-validate 两条 job 全红，而同仓
        #   test-m-gate-format / quality.yml 装依赖后是绿的 ⇒ **「红的那条没人点开」**
        #   经典绿灯幻觉（教训 #430 已记录 v2.12.62 同族）。本 job 现口径与
        #   test-m-gate-format / quality.yml / 门 N「两份锁定文件」一致：两份全装。
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r tests/requirements-test.txt

      - name: 跑 self-audit-gate.sh
        run: |
          chmod +x scripts/self-audit-gate.sh
          bash scripts/self-audit-gate.sh

  test-official-validate:
    # v2.12.37 新增，回应全量审计 P0-1：项目自审 25 门全绿但官方校验器直接拒收
    # （description 含尖括号）—— 入口文档能否被平台加载必须由官方校验器说了算。
    runs-on: ubuntu-latest
    name: 官方 SKILL.md 校验（quick_validate.py）
    steps:
      - uses: actions/checkout@v5
      - name: 安装 openclaw（取官方 skill-creator 校验器）
        run: npm i -g openclaw --silent
      - name: 跑官方 quick_validate.py
        run: |
          QV="$(npm root -g)/openclaw/skills/skill-creator/scripts/quick_validate.py"
          test -f "$QV"
          python3 "$QV" .

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 安装依赖（两份锁定文件全装，门 AB 真源需要 pytest）
        # v2.14.4 后补（教训 #430 同族·假绿灯）：同 test-self-audit-gate job，本步骤
        #   「自审门（强制要求校验器存在）」直接 bash scripts/self-audit-gate.sh，
        #   未装 tests/requirements-test.txt ⇒ 门 AB 在 CI 必红。安装口径与
        #   test-self-audit-gate / test-m-gate-format / 门 N「两份锁定文件」一致。
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r tests/requirements-test.txt

      - name: 自审门（强制要求校验器存在）
        run: |
          chmod +x scripts/self-audit-gate.sh
          LUNHENG_REQUIRE_QUICK_VALIDATE=1 bash scripts/self-audit-gate.sh
