name: 版本号一致性检查（v2.3.0 重构，教训 #116；v2.11.1 起 CI 直接调 check-version.sh）

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    paths:
      - 'SKILL.md'
      - 'references/**/*.md'
      - 'scripts/check-version.sh'
      - 'scripts/sync-version.sh'
      - '.github/workflows/version-check.yml'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'SKILL.md'
      - 'references/**/*.md'
      - 'scripts/check-version.sh'
      - 'scripts/sync-version.sh'
      - '.github/workflows/version-check.yml'

jobs:
  version-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # v2.11.1 修订（教训 #249 系列）：CI 不再维护独立的静态文件清单，
      # 直接调用 scripts/check-version.sh（单一真源），杜绝「sync 有但 check 漏」的清单漂移。
      - name: 版本号一致性检查（调 check-version.sh 单一真源）
        run: |
          echo "=== 调用 scripts/check-version.sh ==="
          bash ./scripts/check-version.sh

      - name: 检查 9 角色编号 v2.3.0 一致性（教训 #116）
        run: |
          echo "=== 9 角色编号 v2.3.0 一致性检查 ==="

          # v2.3.0 角色编号重构：任何文件出现 v2.2.x 旧角色命名（非历史段）→ FAIL
          # 旧命名 → 新命名：T6 案例检索→T3 / T8 批判→T6 / T5 审计→T7 / T7 终检→T8 / T3 分析→T4 / T4 写手→T5
          LEGACY_ROLES=(
            'T6 案例检索'
            'T8 批判'
            'T5 审计'
            'T7 终检'
            'T3 分析'
            'T4 写手'
            'T1/T2/T6'
            'T1∥T2∥T6'
          )

          FILES=(
            "references/_shared/glossary-full.md"
            "references/_shared/glossary-core.md"
            "references/pipeline-readme.md"
            "README.md"
            "SKILL.md"
            "references/agents/00-主控-coordinator.md"
          )

          ROLE_FAIL=0

          for file in "${FILES[@]}"; do
            if [ ! -f "$file" ]; then
              continue
            fi

            for p in "${LEGACY_ROLES[@]}"; do
              # 排除合法的「v2.3.0 重构标注段」+「版本历史 changelog/表格」（含 v2.x 版本号标记的行）
              hits=$(grep -E "$p" "$file" 2>/dev/null \
                     | grep -v 'v2\.[0-9]' | grep -v '→T' | grep -v '原 T' | grep -v '应改' | wc -l)
              if [ "$hits" -gt 0 ]; then
                echo "  ❌ $file 含真正 v2.2.x 角色命名 '$p' ($hits 处)"
                ROLE_FAIL=$((ROLE_FAIL+1))
              else
                echo "  ✅ $file 无 v2.2.x 角色命名 '$p'"
              fi
            done
          done

          echo ""
          if [ "$ROLE_FAIL" -eq 0 ]; then
            echo "✅ 9 角色编号 v2.3.0 一致性检查通过"
            exit 0
          else
            echo "❌ 9 角色编号一致性检查失败（$ROLE_FAIL 处）"
            exit 1
          fi
