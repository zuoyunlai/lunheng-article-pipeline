name: 版本号一致性检查（v2.3.0 重构，教训 #116；v2.11.1 起 CI 直接调 check-version.sh）

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    paths:
      - 'SKILL.md'
      - 'references/**/*.md'
      - 'scripts/check-version.sh'
      - 'scripts/sync-version.sh'
      - '.github/workflows/version-check.yml'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'SKILL.md'
      - 'references/**/*.md'
      - 'scripts/check-version.sh'
      - 'scripts/sync-version.sh'
      - '.github/workflows/version-check.yml'

jobs:
  version-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # v2.11.1 修订（教训 #249 系列）：CI 不再维护独立的静态文件清单，
      # 直接调用 scripts/check-version.sh（单一真源），杜绝「sync 有但 check 漏」的清单漂移。
      - name: 版本号一致性检查（调 check-version.sh 单一真源）
        run: |
          echo "=== 调用 scripts/check-version.sh ==="
          bash ./scripts/check-version.sh

      # v2.12.6（教训 #116）：9 角色编号旧命名检查已迁入 scripts/check-version.sh。
      # 原内联实现的豁免条件依赖「行内含 v2.x 版本号 token」，v2.12.5 语义锚点清理
      # 删掉标注行里的版本号后豁免失效 → 本地 check 绿、CI 红。现由单一真源统一判定。
