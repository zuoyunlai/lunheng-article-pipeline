name: Code Quality

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  lint:
    name: Lint & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r tests/requirements-test.txt
      
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts'
          severity: warning
      
      - name: Run pytest
        # v2.12.40 修复（2026-09-14）：旧写法 `cd tests` 后再 `--cov=.` ⇒ 覆盖率只统计 tests/ 自身，
        #   scripts/ 覆盖率恒为 0、报告无信息量；且只装 requirements.txt，漏装 pytest 版本锁定真源。
        #   现口径：在**仓库根**跑 pytest（testpaths=tests 由 pyproject 提供）且 --cov=scripts；
        #   两份 requirements 全装（与门 N「两份锁定文件」口径对齐）。
        run: |
          pytest -v --tb=short --cov=scripts --cov-report=term-missing
      
      - name: Run self-audit gate
        run: |
          bash scripts/self-audit-gate.sh
      
      - name: Check version consistency
        run: |
          bash scripts/check-version.sh
      
      - name: Validate Python syntax
        run: |
          python -m py_compile scripts/*.py tests/*.py
