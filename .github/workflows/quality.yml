name: Code Quality

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  lint:
    name: Lint & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r tests/requirements-test.txt
      
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0   # P2-7 修订（2026-09-30 发版核查更正）：上游真实 tag **无 v 前缀**（v2.0.6 不存在 → CI 报 Unable to resolve action）；钉到最新真实 tag 2.0.0
        with:
          scandir: './scripts'
          severity: warning

      - name: Run self-audit gate
        run: |
          bash scripts/self-audit-gate.sh
      
      - name: Check version consistency
        run: |
          bash scripts/check-version.sh
      
      - name: Validate Python syntax
        run: |
          python -m py_compile scripts/*.py tests/*.py

      - name: Check changelog completeness
        run: python3 scripts/changelog-check.py --check

      - name: Run path-canonical boundary tests
        run: bash scripts/test-path-canonical.sh

      - name: Run pytest（快速档：-m "not slow"；含 slow 的全量见 ci-test.yml slow/fast 双 job）
        # 2026-10-03 CI 收口提速 ①②：
        #   ① 位置：本步由 job 首步**移到末步** —— 旧顺序下任何便宜门（自审门/版本号/
        #      语法/changelog/路径边界）失败都要等本步跑完才轮到。实测 run 37121582571：
        #      Run pytest 红 ⇒ 其后 5 步全部 skipped，22 分钟后才有结论。
        #   ② 口径：本步只跑 `-m "not slow"`（slow 标记已注册于 pyproject：12 个测试
        #      文件对 self-audit-gate.sh 做 49 次 subprocess ≈ 470s）；**含 slow 的全量**
        #      仍由 ci-test.yml 的 slow/fast 双 job 跑同一份 tests/ 全量（并集 = 全量），覆盖面未缩。
        #   原 v2.12.40 口径保留：仓库根跑 pytest（testpaths=tests）+ --cov=scripts；
        #   两份 requirements 全装（与门 N「两份锁定文件」口径对齐）。
        run: |
          pytest -v --tb=short --durations=15 --cov=scripts --cov-report=term-missing -m "not slow"
