# ⚠️ 派生视图 —— 禁止手改（改真源后由切片生成器重新生成）
# 唯一真源 = ../phase-order.yaml；一致性由生成器 --check 校验
# 本切片 = 节点 t1b_targeted_review（Phase 4.3 定向回查（T1b））的完整定义，读它即可推进该节点。
id: t1b_targeted_review
phase: Phase 4.3 定向回查（T1b）
phase_seq: 14
kind: conditional_agent
verdict_scale: four_tier
rerun_after_report: true
agent: T1b
role: T1
write_authority: executor
verification_authority: 主控
on_worker_failure:
  executor: 主控
  disclosure: degraded_executor
  retry_limit: 1
input: drafts/current_draft.md + drafts/修订说明-v{N}.md + audits/审计报告-vN.md
output: literature/回查报告-v{N}.md
output_chars_max: 8000
condition_undecidable: report_to_owner
condition: t5_t7_report_unverified_references
on_not_triggered: record_not_triggered_in_status
boundary: 仅核验引用存在性与元数据（标题/作者/年份/DOI/URL），不重写正文、不改论证；核验失败条目标注后呈主人处置
max_rounds: 2
rounds_exhausted_outlet:
  trigger: max_rounds_used AND has_unverified_references
  unresolved_levels:
  - P0
  - P1
  owner_decision:
  - id: accept_with_limitations
    label: 接受现状 + Acknowledged Limitations
    requires: deliverables.md 加局限性段 + status.md 记 accepted_under_owner_decision
  - id: manual_verify
    label: 主人自行核验
    requires: 流水线挂起，主人线下核验后回填结论（status 记 pending_owner）
  - id: remove_references
    label: 删除未核验引用
    requires: 主人授权 T5 移除对应引用条目 → 重走 current_draft_sync + t7_5_integrity
  no_default_option: true
  halt_pending_owner: true
after_each:
- rerun_t7_5_integrity
note: v2.13.0 P0-1（ECS 实战反馈）：T5 修订轮新增 [Lxx]/[Dxx]/[Cxx] 标「待人工核验」而 T1 已结束 ⇒ 本窗口 spawn T1b 定向回查（复用 01-文献检索 角色卡铁律与 research 档工具面）。输出逐条：原检索信息 / 回查原始来源 / 评级（成功|部分成功|失败）+ 提升后信任级别；卡片更新由主控 write。派发话术 = dispatch/T1b-定向回查.md。
next: t7_5_integrity
