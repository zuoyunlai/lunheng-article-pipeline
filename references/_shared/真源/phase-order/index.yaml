#   实测：t9_review 依赖 owner_peer_review_consent 而全仓无生产方 ⇒ 节点静默不触发。
#   规则：字段名无生产方 ≠ 保守失败，而是断链——条件永远取假，节点在认知层与执行层同时消失。
