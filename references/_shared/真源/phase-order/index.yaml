# 真源第二部分 = 同目录 <node>.yaml；装配视图 = ../phase-order.yaml（生成物，禁手改）。当前节点切片共 26 个（v2.14.0 新增 t9b_stress_test；v2.15.7 新增 post_phase1_dispatch_verify，ECS 反馈：防 spawn 静默失败）。
# 校验 = 维护者侧生成器 --check（门 AA）。

# 论衡阶段真源（版本随 SKILL.md 同步）
# 产出语言由 Phase 0「目标语言」字段显式选择（不设默认）；本文件中文注释/产物名不构成对使用者的语言限制。
