verdict_scale:
  four_tier:
    tiers:
    - id: pass
      label: 通过
      blocks_pipeline: false
      triggers_revision: false
      action: 放行至下一节点
    - id: fail
      label: 不通过
      blocks_pipeline: true
      triggers_revision: true
      action: 触发对应修订（T5/T7 独立写手）或补检索
    - id: undecidable
      label: 无法判定
      blocks_pipeline: true
      triggers_revision: false
      action: 补证据或在人环裁决后重跑同一判定
    - id: path_or_param_error
      label: 路径或参数错误
      blocks_pipeline: true
      triggers_revision: false
      not_content_defect: true
      action: 修正路径/参数/前置产物后重跑同一判定；不得当作内容缺陷
    default_handling:
      pass: continue_to_next
      fail: halt_then_revision_outlet
      undecidable: halt_pending_evidence_or_owner_ruling
      path_or_param_error: halt_fix_inputs_then_rerun_same_node
  report_after_rerun_doctrine: '凡 condition 依赖他角色报告、或 mechanical_checkpoint 前置为「相关报告/产物已落盘」者， 必须在报告落盘后重跑；主控预跑的结果不得直接当作闸门输入。节点级标注 = rerun_after_report: true。

    '
silence_doctrine:
  invariant: silence_is_not_valid_decision
  halt_kinds:
  - pending_owner_halt
  forbidden_kinds:
  - auto_continue
  - silent_proceed
  - degrade_and_continue
  applies_to:
  - owner_timeout_policy
  - provider_silence_escalation
owner_timeout_policy:
  no_answer_minutes: 60
  fallback_kinds:
    pending_owner_halt: 写 status.md `pending_owner` + 告警挂起，不静默推进（四节点统一，无例外）
  default_fallback: pending_owner_halt
  doctrine: '无明确决策 = 未通过。主人 N 分钟（no_answer_minutes）无应答 → 主控写 status.md `pending_owner` 并告警挂起，不静默推进。任何「主人未回复」「主控代为判断」「子代理说已确认」「产物文件已存在」 都不是有效决策，不得据此推进下一节点，也不得记为 accepted。

    '
provider_silence_escalation:
  trigger: consecutive_silent_runs
  scope: same_provider
  threshold: 3
  on_threshold: pause_owner_three_choice
  owner_choices:
  - id: switch_provider_family
    label: 换 provider 族
    requires: 停下当前节点，改派不同 provider 族的模型（族级独立性真源 = 模型候选池.md §三）
  - id: switch_capability_tier
    label: 换能力档
    requires: 在候选池内换能力档（顶配档不可用 ⇒ 显式降档并披露审计/批判深度影响）
  - id: accept_same_source_with_disclosure
    label: 接受同源并披露
    requires: 主人接受同源继续 ⇒ final/交付说明.md 必须披露「审稿独立性与模型同源」局限
  no_default_option: true
  halt_pending_owner: true
  reset_condition: switch_then_successful_output
  record: status.md 模型分配表（含「静默计数」列）
  doctrine: '同 provider 连续静默 ≥3 次 ⇒ 强制呈现主人三选，不再静默继续。本规则与 `top_tier_liveness_gate` 互补： 后者管 spawn **前**探活（attempts / min_interval / staleness），本规则管 **accepted 之后不产出**。 回传口径：主控在 status.md 记静默计数，并在 Phase 0 后置与每轮派发后更新；达阈即暂停。

    '
terminal_freeze:
  protected_paths:
  - final/
  - drafts/current_draft.md
  freeze_state: accepted
  reopen_required_gates:
  - g14_style_gate
  - t9_review
  rerun_after_post_acceptance: true
  enforcement: flow_check_rule_15 + t8_assertion
  doctrine: '终态后任何写入受保护路径 ⇒ 主控必须 (1) 状态机 status.md 记 post_acceptance_reopen + 原因， (2) 依次重跑 g14_style_gate / t9_review / final_assembly / t8_technical_final， (3) 重新取主人在 phase5_acceptance 拍板（仍走 owner_checkpoint，不得默认保留旧 accepted）。

    '
