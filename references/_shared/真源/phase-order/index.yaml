# 论衡流程真源 · 第一部分：跨阶段契约（逐字保留原文本）+ 节点路由（**顺序唯一真源**）
# 真源第二部分 = 同目录 <node>.yaml；装配视图 = ../phase-order.yaml（生成物，禁手改）。
# 校验 = 维护者侧生成器 --check（门 AA）。

# 论衡阶段真源（版本随 SKILL.md 同步）
# 产出语言由 Phase 0「目标语言」字段显式选择（不设默认）；本文件中文注释/产物名不构成对使用者的语言限制。
# 这是流程顺序与阻断关系的唯一真源；运行时由主控使用 read/write/edit 执行。
# agent 报告节点含 output_chars_max（**双上限**：`output_chars_max` = 报告**写盘**上限；**回传**上限恒为平台硬上限 4096 字符，见 执行韧化协议-exec.md § 报告长度上限与分块协议）
# 平台事实（官方文档）：completion 回传 findings ≤ 4096 字符 / 单条结果 ≤ 512 / 路由通知 ≤ 1024 —— 超限即被截断，不报错
# 别名映射（文档层 → 本文件符号 id）：Phase 3.6 = t6_critique；**Phase 3.7 = t5_feedback_revision**；Phase 4 = t7_audit；Phase 4.2 = audit_revision；**Phase 4.3 = t1b_targeted_review**；**Phase 4.4 前置 = g14_style_gate**；**Phase 4.4 = phase4_4_figures**；Phase 4.5 = t9_review
# ⚠️ v2.12.40（业主定案 A1/A2）：G14 由「Phase 3.6 与 T6 同批、且每轮修订后复检」迁至「**Phase 4.4 前置**」，语义变为
#   「**定稿前的最后一道闸；风格修订后全文复检 ≤2 轮（v2.13.0 P0-2）**」；不再是可选项（按 Phase 0「目标语言」字段客观适用）。
#   **执行前提 = 「已可定稿」**：前置修订尚未收敛（还不能定稿）时**不执行 G14**；G14 检查后由 T5 做**最后一次**（仅风格层）修订。
#   详见 `g14_style_gate` / `t5_style_revision` 节点注，以及 references/gates/14-中文AI痕迹-gate.md §四。
# ⚠️ v2.12.27：本映射表是**进度标签的唯一真源** —— 主控呈现 Phase 标签时必须取自此处，**不得自创**（实测教训：无编号节点曾被误标为「Phase 4.2」，导致整段跳过 T7 审计）
# ⚠️ 结构约束（v2.12.30 起由构建侧流程检查机械校验；v2.12.37 补 ⑤⑥⑦）：
#   ① **同一节点内不得出现重复键**（YAML 后键会静默覆盖前键 —— 2026-09-12 审计 P0-2：重复 `output` 曾使 G14 报告路径丢失）；
#   ② `output` 可为**字符串**（单产物，多产物用 `A.md + B.md` 写法）或 **`角色: 路径` 映射**（多产物并行节点）—— 映射时**每个值都是必须核对的产物**；
#   ③ 执行类节点（agent / owner_agent / parallel_agents / conditional_agent / advisory_agent / bounded_loop）**必须同时声明 `input` 与 `output`**；
#   ④ **每个被消费的受管路径都必须有节点以 `output` 生产**（v2.12.37 取消原「≥2 消费者」前提 —— 单消费者路径同样逃检，实测 `analysis/T5-写作上下文.md` / `final/定稿.md` 均被漏掉）；
#   ⑤ 声明 `condition` 的节点必须给出未触发处置（`on_not_triggered` / `degrade` / `decisions` 三者其一），防「未触发」与「漏跑」不可分；
#   ⑥ 产出 `drafts/初稿-v#.md` 的节点，沿 next/after_each 到达 `t7_audit` 的路径**必须经过 `current_draft_sync`**（v2.12.37 审计 P0-2：Phase 3.7 修订后未刷新 current_draft → T7 审旧稿）；
#   ⑦ 条件节点未触发的留痕口径与 `on_not_triggered: record_not_triggered_in_status` 一致；
#   ⑧ **`verdict_scale` 名称必须可解析**（v2.12.40 修 P0-1）：节点写 `verdict_scale: <名>` 时，该名必须在本文件顶层
#      `verdict_scale.<名>` 有定义，且定义含 `tiers`（四档）与 `default_handling`（四档全覆盖，禁 fail-open）。
#      未接线 = 构建期 flow-check 失败。原实况为「只写名称、无同名定义、节点无分档处置」→「路径/参数错误」档 fail-open 放行；
#   ⑨ `on_fail` / `verdict_handling` 中出现的节点 id 必须已定义（v2.12.40 新增键，纳入规则①的引用校验面）。
#   ⑩ **owner_checkpoint 必须具备完整人环闸门声明**（v2.12.49 新增，修 P2-1「阻断语义只活在散文」）：
#      每个 `kind: owner_checkpoint` 节点必须声明 `blocking: true` + `owner_visible: true` + 非空 `decisions`
#      + `timeout_fallback`；顶层 `owner_checkpoints` 列表必须与该 kind 的节点集**双向一致**。
#      未声明 = 构建期 flow-check 失败（规则 12）。本条把「人环闸门不可自动绕过」从文档纪律升级为机械可校验。
#      反面实例（v2.12.48 前实况）：恰是最不能自动推进的四个节点**全都没写 blocking**，
#      而 pre_spawn_enforcement / phase1_5_targeted_review / t9_review 都写了 —— 本文件自称
#      「流程顺序与阻断关系的唯一真源」，却独独承载不到「人环闸门阻断」这一条。
#   ⑪ **无应答处置的唯一真源 = 顶层 `owner_timeout_policy`**（v2.12.49 新增，修 P2-2）：
#      人环节点无应答一律 `pending_owner_halt`（写 status `pending_owner` + 告警挂起，不静默推进）；
#      静默**永不**等于有效决策。docs 层只引用本节，**不得重列分钟数**（一条款一真源）。
#   ⑫ **盲审节点禁主控代笔**（v2.12.55 S-2 新增，修「同一节点两条互斥条款并存」）：
#      凡 `independence: blind_review` 的节点，**禁止主控代笔** —— 主控已读遍全部内部材料，代笔即独立性归零，
#      且**事后不可修复**（产物看起来完整）。故该节点**不得**声明通用 fallback `on_worker_failure.executor: 主控`；
#      失败唯一合法恢复动作 = **重试 spawn 独立子代理**（`independence_failure_policy.retry_limit` 可调）；
#      仍失败 ⇒ **记为缺失 + 显式告知主人**，**不得自行产出该节点的结论**。
#      反面实况（v2.12.54 前）：`t9_review` **同时**声明通用 fallback（= 主控接管）与下方
#      `independence_rules`「必须 spawn 为独立子代理（禁主控代笔）」→ 两条互斥条款并存，
#      实测被读成「主控代写审稿报告并给出编造精度」。未接线 = 构建期 flow-check 失败（规则 30）。
#   ⑬ **同 provider 连续静默升级**（v2.12.55 S-3）：同 provider 连续 ≥3 次静默 ⇒ 强制主人三选、
#      无默认、必须挂起。真源 = 顶层 `provider_silence_escalation`（含实测背景，见其段注）；未接线 = 规则 31。

version: 2.13.4

# ⚠️ 判定结果分档（v2.12.40）：本文件的 condition / mechanical_checkpoint 节点，结论一律落以下四档之一
#   （替代「退出码」语义；真源 = references/_shared/真源/M-Gate-Algorithm.md §判定结果分档）。
#   关键纪律：`路径或参数错误` 与 `无法判定` 均**不触发内容修订轮**——前者修路径/参数后重跑，
#   后者补证据或在人环裁决后重跑。把「产物不存在」当内容缺陷会白烧一轮修订。
# v2.12.40 修 P0-1：原写法把档位表直接挂在 `verdict_scale.tiers`，而节点引用的是**名称** `four_tier`
#   —— 全文件无同名定义，且各节点无分档处置分支 → 非「通过」档沿无条件 `next` fail-open。
#   现改为「名称 → 定义」结构：节点写 `verdict_scale: four_tier`，定义在 `verdict_scale.four_tier`。
verdict_scale:
  four_tier:
    tiers:
      - id: pass
        label: 通过
        blocks_pipeline: false
        triggers_revision: false
        action: 放行至下一节点
      - id: fail
        label: 不通过
        blocks_pipeline: true
        triggers_revision: true
        action: 触发对应修订（T5/T7 独立写手）或补检索
      - id: undecidable
        label: 无法判定
        blocks_pipeline: true
        triggers_revision: false
        action: 补证据或在人环裁决后重跑同一判定
      - id: path_or_param_error
        label: 路径或参数错误
        blocks_pipeline: true
        triggers_revision: false
        not_content_defect: true
        action: 修正路径/参数/前置产物后重跑同一判定；不得当作内容缺陷
    # 默认处置（v2.12.40 新增，修 P0-1 的「零分档处置」）：节点未写 `verdict_handling` 时按此表解析。
    # **禁止 fail-open**：只有 `pass` 沿 `next` 放行；其余三档一律 halt 或走显式出口（如 `on_fail:`）。
    default_handling:
      pass: continue_to_next
      fail: halt_then_revision_outlet
      undecidable: halt_pending_evidence_or_owner_ruling
      path_or_param_error: halt_fix_inputs_then_rerun_same_node
  report_after_rerun_doctrine: >
    凡 condition 依赖他角色报告、或 mechanical_checkpoint 前置为「相关报告/产物已落盘」者，
    必须在报告落盘后重跑；主控预跑的结果不得直接当作闸门输入。节点级标注 = rerun_after_report: true。

# ⚠️ 跨状态机共享不变式（v2.12.65 新增，修 P2-2「同侧只活在散文」）
#   `owner_timeout_policy`（主人无应答）与 `provider_silence_escalation`（同 provider 连续静默）
#   共享同一不变式 —— **静默/无应答 ≠ 有效决策 ⇒ 挂起等主人 + 无默认继续**。
#   此前该不变式只用散文声明「与 `owner_timeout_policy` 同侧」，**无任何机械门**：任一侧被改成
#   自动继续，另一侧不会报红。现收敛为单一真源 + flow-check 规则 40 双向投影校验。
silence_doctrine:
  invariant: silence_is_not_valid_decision
  halt_kinds: [pending_owner_halt]                       # 「挂起等主人」类处置的**唯一枚举**
  forbidden_kinds: [auto_continue, silent_proceed, degrade_and_continue]  # 禁止的 fail-open 处置
  applies_to: [owner_timeout_policy, provider_silence_escalation]

# ⚠️ 人在环节点无应答处置的**唯一真源**（v2.12.49 新增，修 P2-2）
#   已删除的旧语义（防回潮）：「Phase 5 复用『不答 = 接受当前定稿』」。
#     该写法使 Phase 5 成为**全流程唯一 fail-open 人环节点** —— 静默 60 分钟即等于主人拍板「接受」；
#     且它只活在散文（`glossary-full.md` §十二 / `00-主控-扩展职责.md` §二十一），真源 yaml 未表达，
#     与「无明确决策 = 未通过」正面张力。
#   现口径：四个 owner_checkpoint **一律 fail-closed**，无例外。无应答 = 写 status `pending_owner`
#     + 告警挂起。静默、主控推断、子代理回执、「产物文件已存在」**均不得记为 accepted**。
#   Phase 5 虽为终态节点（无下游 Phase 可推进），但「接受」仍是主人决策：定稿文件已在磁盘，
#     挂起不丢任何产物；主人事后一句 accepted 即可收口。恢复旧行为须经主人明确裁决并在此登记。
owner_timeout_policy:
  no_answer_minutes: 60
  fallback_kinds:
    pending_owner_halt: 写 status.md `pending_owner` + 告警挂起，不静默推进（四节点统一，无例外）
  default_fallback: pending_owner_halt
  doctrine: >
    无明确决策 = 未通过。主人 N 分钟（no_answer_minutes）无应答 → 主控写 status.md `pending_owner`
    并告警挂起，不静默推进。任何「主人未回复」「主控代为判断」「子代理说已确认」「产物文件已存在」
    都不是有效决策，不得据此推进下一节点，也不得记为 accepted。

# ⚠️ 终态冻结真源（v2.12.49 新增，修 M-2「终态后修改直接出门」）
#   `phase5_acceptance.terminal = accepted` 标记后，下列对受管产物的写入**必须回到 g14_style_gate 重跑**，
#   且 `rerun_after_post_acceptance` 必须为 true：
#   1. `final/` 子树（含定稿/图件/交付说明/证据包）
#   2. `drafts/current_draft.md`（「当前权威稿」指针）
#   未重跑就标 accepted = 假绿灯；flow-check 规则 15 在 `phase5_acceptance` 与 `g14_style_gate` 两处做双向校验。
#   G14 「只审一次」语义**仅适用未越出终态的场景**；跨过终态后**必须重跑**（防止补图/补占位等未审计修改出厂）。

# ⚠️ 同 provider 连续静默升级的**唯一真源**（v2.12.55 S-3 新增，修 P1「同 provider 连续 4 次静默无升级规则」）
#   实测背景（2026-09-18 论文实跑）：T6 / T7 / G14 / T9 四个顶配档节点**全为同一 provider**，
#     连续 4 次静默（spawn 返回成功、随后既无产物落盘也无交接回执），全程**无任何升级动作** ——
#     因 `top_tier_liveness_gate` 只做 spawn **前**探活，**管不到 accepted 之后不产出**。
#   规则：同一 provider 连续 ≥3 次静默 ⇒ **强制暂停 + 呈现主人三选**，**不再静默继续**。
#     三项**无默认**；静默**永不**等于有效决策（「同侧」真源 = 顶层 `silence_doctrine`，规则 40 机械校验）。
#   计数口径：一次「静默」= 该次 spawn 既无产物落盘、又无交接回执
#     （与「心跳缺失」区分：心跳仍在续 = 未静默，不计数）。
#   归零：换族或换档并成功产出后计数归零（status.md 记 `resolved_by`）。
provider_silence_escalation:
  trigger: consecutive_silent_runs
  scope: same_provider          # 仅统计同一 provider 内的连续静默；换 provider 即重新计数
  threshold: 3
  on_threshold: pause_owner_three_choice
  owner_choices:                # 三选一（无默认；主人拍板）
    - id: switch_provider_family
      label: 换 provider 族
      requires: "停下当前节点，改派不同 provider 族的模型（族级独立性真源 = 模型候选池.md §三）"
    - id: switch_capability_tier
      label: 换能力档
      requires: "在候选池内换能力档（顶配档不可用 ⇒ 显式降档并披露审计/批判深度影响）"
    - id: accept_same_source_with_disclosure
      label: 接受同源并披露
      requires: "主人接受同源继续 ⇒ final/交付说明.md 必须披露「审稿独立性与模型同源」局限"
  no_default_option: true       # 不得「按最保守项自动继续」，也不得静默重派同 provider
  halt_pending_owner: true      # 到阈值即挂起等主人，不自动继续
  reset_condition: switch_then_successful_output   # 换族/换档且成功产出 ⇒ 计数归零
  record: status.md 模型分配表（含「静默计数」列）
  doctrine: >
    同 provider 连续静默 ≥3 次 ⇒ 强制呈现主人三选，不再静默继续。本规则与 `top_tier_liveness_gate` 互补：
    后者管 spawn **前**探活（attempts / min_interval / staleness），本规则管 **accepted 之后不产出**。
    回传口径：主控在 status.md 记静默计数，并在 Phase 0 后置与每轮派发后更新；达阈即暂停。
terminal_freeze:
  protected_paths:
    - final/
    - drafts/current_draft.md
  freeze_state: accepted
  reopen_required_gates: [g14_style_gate, t9_review]   # 重跑顺序：先风格、后同行
  rerun_after_post_acceptance: true
  enforcement: flow_check_rule_15 + t8_assertion
  doctrine: >
    终态后任何写入受保护路径 ⇒ 主控必须 (1) 状态机 status.md 记 post_acceptance_reopen + 原因，
    (2) 依次重跑 g14_style_gate / t9_review / final_assembly / t8_technical_final，
    (3) 重新取主人在 phase5_acceptance 拍板（仍走 owner_checkpoint，不得默认保留旧 accepted）。
# ⚠️ v2.12.46（业主定案）：论衡**只有一个标准架构 = 多 Agent 九角色流水线**。
#   T1-T7 / T9 / G14 = worker 角色，各自写自己的正式角色产物；主控（T0/T8）负责流程状态、
#   权威稿同步、配图、定稿组装、终检与交付裁决。**不存在与多 Agent 并列的「单主控模式」**：
#   worker 不可用/失败属**单节点故障**，只对失败节点做主控接管（on_worker_failure），强制披露
#   独立性影响；不改变整条流水线、不跳过任何质量门、不得声称等价于独立角色复核。
#   宿主不存在「架构上不兼容多 Agent」的常态 —— OpenClaw 原生支持子代理；实际可能发生的是
#   策略拒绝 / 超时 / 失败 / 无产物 / 配额不可用等运行故障。
# ⚠️ v2.12.46：**Phase 编号为第一类真源字段** —— 每个节点必须声明 `phase`（文档层标签）与
#   `phase_seq`（流水线序号，唯一且沿 next 边单调不减）。主控呈现 Phase 标签时必须取自本文件，
#   不得自创（教训：无编号节点曾被误标为「Phase 4.2」导致整段跳过 T7 审计）；flow-check 机械校验。
# ── phase_order 段由生成器在此注入（顺序真源 = 本文件末尾 nodes: 路由表）──
architecture:
  standard: multi_agent_role_pipeline
  worker_roles: [T1, T2, T3, T4, T5, T6, T7, T9, G14]
  owner_roles: [T0, T8]
  owner_nodes: [phase0_definition, phase2_5_outline, phase3_5_insight, pre_spawn_enforcement, t2_5_integrity, current_draft_sync, t7_5_integrity, phase4_4_figures, final_assembly, t8_technical_final, methodology_snapshot, phase5_acceptance]
  worker_failure_policy: owner_takeover_with_disclosure
  fallback_is_not_equivalent: true
# ⚠️ P0-3：版本号 vN 只随闸门里程碑推进；minor 自修走 vN.m；风格修订走 vN-style。
version_numbering:
  milestone_rule: vN 整数位只由闸门节点推进（phase3_5_insight / t5_feedback_revision / audit_revision）
  minor_patch: vN.m           # 字数/图位/AI味/M门/术语 → 只推进小数位，不推进整数位
  style_revision: vN-style    # G14 风格修订 → 独立标识，不进 vN 序列
  milestones: [v1|t5_draft_v1, v2|phase3_5_insight, v3|t5_feedback_revision, v4|audit_revision, v5|audit_revision]
