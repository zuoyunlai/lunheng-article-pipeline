  output: final/交付说明.md
  output_chars_max: 10000
  # v2.12.49 M-10：final/局限性.md 入真源（仅 Acknowledged Limitations 模式存在）
  output_conditional:
    acknowledged_limitations_mode: final/局限性.md
  next: methodology_snapshot
