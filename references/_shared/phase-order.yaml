# 论衡阶段真源（版本随 SKILL.md 同步）
# 产出语言由 Phase 0「目标语言」字段显式选择（不设默认）；本文件中文注释/产物名不构成对使用者的语言限制。
# 这是流程顺序与阻断关系的唯一真源；运行时由主控使用 read/write/edit 执行。
# agent 报告节点含 output_chars_max（**双上限**：`output_chars_max` = 报告**写盘**上限；**回传**上限恒为平台硬上限 4096 字符，见 执行韧化协议-exec.md § 报告长度上限与分块协议）
# 平台事实（官方文档）：completion 回传 findings ≤ 4096 字符 / 单条结果 ≤ 512 / 路由通知 ≤ 1024 —— 超限即被截断，不报错
# 别名映射（文档层 → 本文件符号 id）：Phase 3.6 = t6_critique；**Phase 3.7 = t5_feedback_revision**；Phase 4 = t7_audit；Phase 4.2 = audit_revision；**Phase 4.4 前置 = g14_style_gate**；**Phase 4.4 = phase4_4_figures**；Phase 4.5 = t9_review
# ⚠️ v2.12.40（业主定案 A1/A2）：G14 由「Phase 3.6 与 T6 同批、且每轮修订后复检」迁至「**Phase 4.4 前置**」，语义变为
#   「**定稿前的最后一道闸，全流程只审一次、不再复检**」；不再是可选项（按 Phase 0「目标语言」字段客观适用）。
#   **执行前提 = 「已可定稿」**：前置修订尚未收敛（还不能定稿）时**不执行 G14**；G14 检查后由 T5 做**最后一次**（仅风格层）修订。
#   详见 `g14_style_gate` / `t5_style_revision` 节点注，以及 references/gates/14-中文AI痕迹-gate.md §四。
# ⚠️ v2.12.27：本映射表是**进度标签的唯一真源** —— 主控呈现 Phase 标签时必须取自此处，**不得自创**（实测教训：无编号节点曾被误标为「Phase 4.2」，导致整段跳过 T7 审计）
# ⚠️ 结构约束（v2.12.30 起由构建侧流程检查机械校验；v2.12.37 补 ⑤⑥⑦）：
#   ① **同一节点内不得出现重复键**（YAML 后键会静默覆盖前键 —— 2026-09-12 审计 P0-2：重复 `output` 曾使 G14 报告路径丢失）；
#   ② `output` 可为**字符串**（单产物，多产物用 `A.md + B.md` 写法）或 **`角色: 路径` 映射**（多产物并行节点）—— 映射时**每个值都是必须核对的产物**；
#   ③ 执行类节点（agent / owner_agent / parallel_agents / conditional_agent / advisory_agent / bounded_loop）**必须同时声明 `input` 与 `output`**；
#   ④ **每个被消费的受管路径都必须有节点以 `output` 生产**（v2.12.37 取消原「≥2 消费者」前提 —— 单消费者路径同样逃检，实测 `analysis/T5-写作上下文.md` / `final/定稿.md` 均被漏掉）；
#   ⑤ 声明 `condition` 的节点必须给出未触发处置（`on_not_triggered` / `degrade` / `decisions` 三者其一），防「未触发」与「漏跑」不可分；
#   ⑥ 产出 `drafts/初稿-v#.md` 的节点，沿 next/after_each 到达 `t7_audit` 的路径**必须经过 `current_draft_sync`**（v2.12.37 审计 P0-2：Phase 3.7 修订后未刷新 current_draft → T7 审旧稿）；
#   ⑦ 条件节点未触发的留痕口径与 `on_not_triggered: record_not_triggered_in_status` 一致；
#   ⑧ **`verdict_scale` 名称必须可解析**（v2.12.40 修 P0-1）：节点写 `verdict_scale: <名>` 时，该名必须在本文件顶层
#      `verdict_scale.<名>` 有定义，且定义含 `tiers`（四档）与 `default_handling`（四档全覆盖，禁 fail-open）。
#      未接线 = 构建期 flow-check 失败。原实况为「只写名称、无同名定义、节点无分档处置」→「路径/参数错误」档 fail-open 放行；
#   ⑨ `on_fail` / `verdict_handling` 中出现的节点 id 必须已定义（v2.12.40 新增键，纳入规则①的引用校验面）。
#   ⑩ **owner_checkpoint 必须具备完整人环闸门声明**（v2.12.49 新增，修 P2-1「阻断语义只活在散文」）：
#      每个 `kind: owner_checkpoint` 节点必须声明 `blocking: true` + `owner_visible: true` + 非空 `decisions`
#      + `timeout_fallback`；顶层 `owner_checkpoints` 列表必须与该 kind 的节点集**双向一致**。
#      未声明 = 构建期 flow-check 失败（规则 12）。本条把「人环闸门不可自动绕过」从文档纪律升级为机械可校验。
#      反面实例（v2.12.48 前实况）：恰是最不能自动推进的四个节点**全都没写 blocking**，
#      而 pre_spawn_enforcement / phase1_5_targeted_review / t9_review 都写了 —— 本文件自称
#      「流程顺序与阻断关系的唯一真源」，却独独承载不到「人环闸门阻断」这一条。
#   ⑪ **无应答处置的唯一真源 = 顶层 `owner_timeout_policy`**（v2.12.49 新增，修 P2-2）：
#      人环节点无应答一律 `pending_owner_halt`（写 status `pending_owner` + 告警挂起，不静默推进）；
#      静默**永不**等于有效决策。docs 层只引用本节，**不得重列分钟数**（一条款一真源）。
version: 2.12.48

# ⚠️ 判定结果分档（v2.12.40）：本文件的 condition / mechanical_checkpoint 节点，结论一律落以下四档之一
#   （替代「退出码」语义；真源 = references/_shared/M-Gate-Algorithm.md §判定结果分档）。
#   关键纪律：`路径或参数错误` 与 `无法判定` 均**不触发内容修订轮**——前者修路径/参数后重跑，
#   后者补证据或在人环裁决后重跑。把「产物不存在」当内容缺陷会白烧一轮修订。
# v2.12.40 修 P0-1：原写法把档位表直接挂在 `verdict_scale.tiers`，而节点引用的是**名称** `four_tier`
#   —— 全文件无同名定义，且各节点无分档处置分支 → 非「通过」档沿无条件 `next` fail-open。
#   现改为「名称 → 定义」结构：节点写 `verdict_scale: four_tier`，定义在 `verdict_scale.four_tier`。
verdict_scale:
  four_tier:
    tiers:
      - id: pass
        label: 通过
        blocks_pipeline: false
        triggers_revision: false
        action: 放行至下一节点
      - id: fail
        label: 不通过
        blocks_pipeline: true
        triggers_revision: true
        action: 触发对应修订（T5/T7 独立写手）或补检索
      - id: undecidable
        label: 无法判定
        blocks_pipeline: true
        triggers_revision: false
        action: 补证据或在人环裁决后重跑同一判定
      - id: path_or_param_error
        label: 路径或参数错误
        blocks_pipeline: true
        triggers_revision: false
        not_content_defect: true
        action: 修正路径/参数/前置产物后重跑同一判定；不得当作内容缺陷
    # 默认处置（v2.12.40 新增，修 P0-1 的「零分档处置」）：节点未写 `verdict_handling` 时按此表解析。
    # **禁止 fail-open**：只有 `pass` 沿 `next` 放行；其余三档一律 halt 或走显式出口（如 `on_fail:`）。
    default_handling:
      pass: continue_to_next
      fail: halt_then_revision_outlet
      undecidable: halt_pending_evidence_or_owner_ruling
      path_or_param_error: halt_fix_inputs_then_rerun_same_node
  report_after_rerun_doctrine: >
    凡 condition 依赖他角色报告、或 mechanical_checkpoint 前置为「相关报告/产物已落盘」者，
    必须在报告落盘后重跑；主控预跑的结果不得直接当作闸门输入。节点级标注 = rerun_after_report: true。

# ⚠️ 人在环节点无应答处置的**唯一真源**（v2.12.49 新增，修 P2-2）
#   已删除的旧语义（防回潮）：「Phase 5 复用『不答 = 接受当前定稿』」。
#     该写法使 Phase 5 成为**全流程唯一 fail-open 人环节点** —— 静默 60 分钟即等于主人拍板「接受」；
#     且它只活在散文（`glossary-full.md` §十二 / `00-主控-扩展职责.md` §二十一），真源 yaml 未表达，
#     与「无明确决策 = 未通过」正面张力。
#   现口径：四个 owner_checkpoint **一律 fail-closed**，无例外。无应答 = 写 status `pending_owner`
#     + 告警挂起。静默、主控推断、子代理回执、「产物文件已存在」**均不得记为 accepted**。
#   Phase 5 虽为终态节点（无下游 Phase 可推进），但「接受」仍是主人决策：定稿文件已在磁盘，
#     挂起不丢任何产物；主人事后一句 accepted 即可收口。恢复旧行为须经主人明确裁决并在此登记。
owner_timeout_policy:
  no_answer_minutes: 60
  fallback_kinds:
    pending_owner_halt: 写 status.md `pending_owner` + 告警挂起，不静默推进（四节点统一，无例外）
  default_fallback: pending_owner_halt
  doctrine: >
    无明确决策 = 未通过。主人 N 分钟（no_answer_minutes）无应答 → 主控写 status.md `pending_owner`
    并告警挂起，不静默推进。任何「主人未回复」「主控代为判断」「子代理说已确认」「产物文件已存在」
    都不是有效决策，不得据此推进下一节点，也不得记为 accepted。
# ⚠️ v2.12.46（业主定案）：论衡**只有一个标准架构 = 多 Agent 九角色流水线**。
#   T1-T7 / T9 / G14 = worker 角色，各自写自己的正式角色产物；主控（T0/T8）负责流程状态、
#   权威稿同步、配图、定稿组装、终检与交付裁决。**不存在与多 Agent 并列的「单主控模式」**：
#   worker 不可用/失败属**单节点故障**，只对失败节点做主控接管（on_worker_failure），强制披露
#   独立性影响；不改变整条流水线、不跳过任何质量门、不得声称等价于独立角色复核。
#   宿主不存在「架构上不兼容多 Agent」的常态 —— OpenClaw 原生支持子代理；实际可能发生的是
#   策略拒绝 / 超时 / 失败 / 无产物 / 配额不可用等运行故障。
# ⚠️ v2.12.46：**Phase 编号为第一类真源字段** —— 每个节点必须声明 `phase`（文档层标签）与
#   `phase_seq`（流水线序号，唯一且沿 next 边单调不减）。主控呈现 Phase 标签时必须取自本文件，
#   不得自创（教训：无编号节点曾被误标为「Phase 4.2」导致整段跳过 T7 审计）；flow-check 机械校验。
phase_order:
  - {seq: 0,  phase: "Phase 0",                 node: phase0_definition}
  - {seq: 1,  phase: "Phase 0 后置（spawn 前核验）", node: pre_spawn_enforcement}
  - {seq: 2,  phase: "Phase 1",                 node: retrieval}
  - {seq: 3,  phase: "Phase 1.5",               node: phase1_5_targeted_review}
  - {seq: 4,  phase: "T2.5 完整性门",         node: t2_5_integrity}
  - {seq: 5,  phase: "Phase 2",                 node: t4_analysis}
  - {seq: 6,  phase: "Phase 2.5",               node: phase2_5_outline}
  - {seq: 7,  phase: "Phase 3",                 node: t5_draft_v1}
  - {seq: 8,  phase: "Phase 3.5",               node: phase3_5_insight}
  - {seq: 9,  phase: "Phase 3.6 前置",        node: current_draft_sync}
  - {seq: 10, phase: "Phase 3.6",               node: t6_critique}
  - {seq: 11, phase: "Phase 3.7",               node: t5_feedback_revision}
  - {seq: 12, phase: "Phase 4",                 node: t7_audit}
  - {seq: 13, phase: "Phase 4.2",               node: audit_revision}
  - {seq: 14, phase: "T7.5 完整性门",         node: t7_5_integrity}
  - {seq: 15, phase: "Phase 4.4 前置（G14 风格闸）", node: g14_style_gate}
  - {seq: 16, phase: "Phase 4.4 前置·风格修订", node: t5_style_revision}
  - {seq: 17, phase: "Phase 4.4",               node: phase4_4_figures}
  - {seq: 18, phase: "Phase 4.4 后置（定稿组装）", node: final_assembly}
  - {seq: 19, phase: "Phase 4.5",               node: t9_review}
  - {seq: 20, phase: "Phase 5 终检",         node: t8_technical_final}
  - {seq: 21, phase: "Phase 5 终检后置（方法论留档）", node: methodology_snapshot}
  - {seq: 22, phase: "Phase 5 验收",         node: phase5_acceptance}
architecture:
  standard: multi_agent_role_pipeline
  worker_roles: [T1, T2, T3, T4, T5, T6, T7, T9, G14]
  owner_roles: [T0, T8]
  owner_nodes: [phase0_definition, phase2_5_outline, phase3_5_insight, pre_spawn_enforcement, t2_5_integrity, current_draft_sync, t7_5_integrity, phase4_4_figures, final_assembly, t8_technical_final, methodology_snapshot, phase5_acceptance]
  worker_failure_policy: owner_takeover_with_disclosure
  fallback_is_not_equivalent: true
condition_definitions:
  owner_peer_review_enabled:
    requires: [owner_peer_review_consent]
  methodology_snapshot_opt_in:
    requires: [owner_methodology_snapshot_consent]
  phase1_5_targeted_review_any_trigger_hit:    # v2.12.49 改名（原 any_listed_trigger_condition_met，名字太空，平台审核判 SQP-1 通用名）：Phase 1.5 复核窗口「列表任一命中」即触发；含义 = trigger_conditions 中 ① 简报标注 [Dxx 待复核] 或 ② t2_5 红数据未回溯 任一为真
    requires: [phase0_review_flags]
  T6_requires_revision:
    requires: [t6_report_p0_or_p1]
  T7_P0_or_P1:
    requires: [t7_report_p0_or_p1]
  target_language_includes_zh:
    requires: [owner_target_language]
  G14_requires_style_revision:
    requires: [g14_report_style_fail]
  figures_approved_by_owner:
    requires: [owner_figure_decision]

owner_checkpoints:
  - phase0_definition
  - phase2_5_outline
  - phase3_5_insight
  - phase5_acceptance
pipeline:
  - id: phase0_definition
    phase: "Phase 0"
    phase_seq: 0
    kind: owner_checkpoint
    blocking: true        # v2.12.49：人环闸门 —— 无明确决策不得推进（真源 = owner_timeout_policy）
    owner_visible: true   # v2.12.49：必须按 checkpoint-card-template 向主人呈现
    decisions: [approved, revision_requested, restart_phase]   # v2.12.28 补：与其余人工节点结构对齐
    timeout_fallback: pending_owner_halt
    output: 01-任务简报.md
    next: pre_spawn_enforcement
  - id: pre_spawn_enforcement
    phase: "Phase 0 后置（spawn 前核验）"
    phase_seq: 1
    kind: mode_declaration
    owner: 主控
    blocking: true
    input: 01-任务简报.md
    output: status.md（Phase 0 同意记录与标准架构声明）
    precondition: Phase 0 外发同意记录 + 目标语言 + 项目名均已写入 01-任务简报.md
    write_authority: owner
    note: "标准架构 = 多 Agent 九角色流水线（无需勾选、不设总开关）。本节点只做 spawn 前前置核验（同意记录 / 目标语言 / 项目名 / 派发角色清单），**不再决定「是否启用多 Agent」**；worker 不可用属单节点故障，走 on_worker_failure 主控接管，不改架构、不跳质量门。"
    next: retrieval
  - id: retrieval
    phase: "Phase 1"
    phase_seq: 2
    input: 01-任务简报.md（+ owner 已确认的语言/同意记录）
    kind: parallel_agents
    role: T1/T2/T3
    agents: [T1, T2, T3]
    write_authority: executor
    verification_authority: 主控
    on_worker_failure: {executor: 主控, disclosure: degraded_executor, retry_limit: 1}
    output:
      T1: literature/文献卡.md
      T2: data/数据卡.md
      T3: cases/案例卡.md
    next: phase1_5_targeted_review
  - id: phase1_5_targeted_review
    phase: "Phase 1.5"
    phase_seq: 3
    kind: conditional_review_window
    verdict_scale: four_tier   # v2.12.40：结论落四档（通过/不通过/无法判定/路径或参数错误），不用退出码
    rerun_after_report: true   # v2.12.40「报告后激活」：依赖 t2_5_integrity 闸门结果 → 必须在该判定重跑后取数
    input: literature/文献卡.md + data/数据卡.md + cases/案例卡.md
    condition: phase1_5_targeted_review_any_trigger_hit   # 激活逻辑：下方 trigger_conditions 列表中「任一」命中即触发本复核窗口；全部未命中 → 走 on_not_triggered（v2.12.28 对齐；v2.12.49 改名自 any_listed_trigger_condition_met，平台审核判 SQP-1 通用名）
    on_not_triggered: record_not_triggered_in_status
    owner_visible: true
    blocking: false
    trigger_conditions:
      - brief_marked_Dxx_for_review       # 命中定义：任务简报「需找数据点」段任一条目标注 [Dxx 待复核]（未标 = 不命中）
      - t2_5_red_data_unresolved          # 命中定义：t2_5_integrity 闸门报 🔴 二手转引未回溯到原始来源（M-Form-6 判定；未报红 = 不命中）
      # （已移除 t9_evidence_score_low：Phase 1.5 时点不可达，属占位条件 —— T9 评分低触发的回查在 Phase 4.5 后单独执行，见 phase-1-details.md）
    decisions: [triggered, not_triggered]
    output_if_triggered: literature/回查报告-vN.md
    required_record: status.md
    after_trigger: rerun_t2_5_integrity   # 动作名（非节点 id）：触发后重跑 t2_5_integrity 闸门
    next: t2_5_integrity
  - id: t2_5_integrity
    phase: "T2.5 完整性门"
    phase_seq: 4
    kind: mechanical_checkpoint
    verdict_scale: four_tier   # v2.12.40：结论落四档；「产物不存在」= 路径或参数错误（非内容缺陷、不触发修订）
    rerun_after_report: true   # v2.12.40「报告后激活」：前提 = data/数据卡.md 已落盘；数据卡被补写后必须重跑
    owner: 主控
    write_authority: owner
    input: data/数据卡.md + cases/案例卡.md + literature/文献卡.md   # v2.12.40 补 P1-5：本闸门的判据对象必须显式声明（原未声明 input → 前置产物无人核对）
    next: t4_analysis
  - id: t4_analysis
    phase: "Phase 2"
    phase_seq: 5
    input: literature/文献卡.md + data/数据卡.md + cases/案例卡.md
    kind: agent
    agent: T4
    role: T4
    write_authority: executor
    verification_authority: 主控
    on_worker_failure: {executor: 主控, disclosure: degraded_executor, retry_limit: 1}
    output: analysis/分析大纲.md + analysis/T5-写作上下文.md   # T5 写作上下文包由 T4 产出（v2.12.37 审计 P1-1：原仅散落角色卡/派发话术，未入真源）
    output_chars_max: 12000   # 写盘上限（回传另受平台 4096 字符硬上限约束）
    next: phase2_5_outline
  - id: phase2_5_outline
    phase: "Phase 2.5"
    phase_seq: 6
    kind: owner_checkpoint
    blocking: true        # v2.12.49：无明确决策不得推进（改方向成本最低的关卡，尤其不得自动放行）
    owner_visible: true
    decisions: [approved, revision_requested, restart_phase]
    timeout_fallback: pending_owner_halt
    next: t5_draft_v1
  - id: t5_draft_v1
    phase: "Phase 3"
    phase_seq: 7
    input: analysis/分析大纲.md + analysis/T5-写作上下文.md
    kind: agent
    agent: T5
    role: T5
    write_authority: executor
    verification_authority: 主控
    on_worker_failure: {executor: 主控, disclosure: degraded_executor, retry_limit: 1}
    output: drafts/初稿-v1.md
    next: phase3_5_insight
  - id: phase3_5_insight
    phase: "Phase 3.5"
    phase_seq: 8
    kind: owner_checkpoint
    blocking: true        # v2.12.49：「无补充」也是决策，必须留痕；静默不得当作无补充
    owner_visible: true
    decisions: [insight, no_insight]
    timeout_fallback: pending_owner_halt
    next: current_draft_sync
  - id: current_draft_sync   # 别名：文档层「Phase 3.6 前置」（非独立 Phase 标签，主控呈现时归入 Phase 3.6）
    phase: "Phase 3.6 前置"
    phase_seq: 9
    kind: mechanical_checkpoint
    verdict_scale: four_tier   # v2.12.40：结论落四档（本节点最常见失败 = 上游稿不存在 → 路径或参数错误档）
    rerun_after_report: true   # v2.12.40「报告后激活」：前提 = 上游最新稿已在磁盘；上游改写后必须重刷
    owner: 主控
    write_authority: owner
    output: drafts/current_draft.md
    note: 主控亲为（不 spawn）：把**当前权威版本**（v2/v3/修订稿）write 复制为 drafts/current_draft.md，保留 draft_id / draft_version 绑定
    precondition: 上游最新稿（drafts/初稿-vN.md 或修订稿）+ Phase 3.5 洞察记录已在磁盘
    next: t6_critique
  - id: t6_critique   # 别名：文档层「Phase 3.6」（v2.12.40：G14 迁出至 Phase 4.4 前置，本节点仅 T6）
    phase: "Phase 3.6"
    phase_seq: 10
    kind: agent
    verdict_scale: four_tier
    agent: T6
    role: T6
    write_authority: executor
    verification_authority: 主控
    on_worker_failure: {executor: 主控, disclosure: degraded_executor, retry_limit: 1}
    degrade: skip_in_lite_tier   # P1-5 修复：轻量档 T6「必跳」在此声明（原键名 `t6_degrade`，v2.12.40 统一为标准键
                                 # `degrade`；真源缺声明时曾致各文件「必跳」/「可跳过」/「已声明为否」三种读法并存）
    input: drafts/current_draft.md
    output: analysis/批判报告-vN.md
    output_chars_max: 12000   # 批判报告（**写盘**上限；回传另受平台 4096 字符硬上限约束，超出走分块协议）
    next: t5_feedback_revision
  - id: t5_feedback_revision   # 别名：文档层「Phase 3.7」（T6/G14 否决后的预审计修订；本轮修完才进 Phase 4）
    phase: "Phase 3.7"
    phase_seq: 11
    input: drafts/初稿-v{N}.md + analysis/批判报告-v{N}.md
    kind: conditional_agent
    verdict_scale: four_tier   # v2.12.40：T6 报告判定落四档
    rerun_after_report: true   # v2.12.40「报告后激活」：前提 = 批判报告已落盘；必须在报告写入后重跑判定
    agent: T5
    role: T5
    write_authority: executor   # T5 = 正式写手：初稿/修订稿由本角色直接落盘
    verification_authority: 主控
    on_worker_failure: {executor: 主控, disclosure: degraded_executor, retry_limit: 1}
    output: drafts/初稿-v{N+1}.md + drafts/修订说明-v{N+1}.md
    condition: T6_requires_revision   # 命中定义：T6 批判报告含任何 P0/P1 否决项（无 = 不命中）
                                      # v2.12.40：G14 已迁出本节点（迁至 Phase 4.4 前置，且只审一次）
    on_not_triggered: record_not_triggered_in_status   # v2.12.28：未触发也必须在 status.md 留痕（防「未触发」与「漏跑」不可分）
    after_each: [current_draft_sync]   # v2.12.37 审计 P0-2：Phase 3.7 产出 v{N+1} 后必须刷新 drafts/current_draft.md，否则 t7_audit 读旧稿 → 修订内容静默逃过 T7 审计（与 audit_revision 同型，原只修了后一分支）
    next: t7_audit
  - id: t7_audit
    phase: "Phase 4"
    phase_seq: 12
    kind: agent
    agent: T7
    role: T7
    write_authority: executor
    verification_authority: 主控
    on_worker_failure: {executor: 主控, disclosure: degraded_executor, retry_limit: 1}
    input: drafts/current_draft.md
    output: audits/审计报告-vN.md
    output_chars_max: 10000
    next: audit_revision
  - id: audit_revision   # 别名：文档层「Phase 4.2」
    phase: "Phase 4.2"
    phase_seq: 13
    kind: bounded_loop
    verdict_scale: four_tier   # v2.12.40：T7 审计报告判定落四档（「本轮无 P0/P1」= 通过，非失败）
    rerun_after_report: true   # v2.12.40「报告后激活」：前提 = 审计报告已落盘；不得沿用审计进行中的中间态
    max_rounds: 2
    input: audits/审计报告-vN.md + drafts/current_draft.md
    output: drafts/初稿-v{N+1}.md + drafts/修订说明-v{N+1}.md
    condition: T7_P0_or_P1   # 命中定义：T7 审计报告存在 P0 或 P1 级发现（全 P2/无发现 = 不命中）
    on_not_triggered: record_not_triggered_in_status   # v2.12.37 门：有 condition 必须声明未触发处置（防「未触发」与「漏跑」不可分）
    # after_each：`current_draft_sync` 是**真节点 id**（每轮修订后必须重写 current_draft.md，否则 T7/T9 读旧稿 —— 2026-09-12 审计 P0-3）；
    # `rerun_t7` 为动作名（非节点 id）：重跑 t7_audit。
    # v2.12.40（业主定案 A1）：**删除 `rerun_g14_if_enabled`** —— G14 不再在每轮修订后复检，改为定稿前只审一次（见 g14_style_gate）。
    # 机械搬运合并（v2.12.32，实测 P2）：`current_draft_sync` 属纯复制，与相邻实质节点合并可少一个 spawn 失败面（实测 sync 3 次各 52-74k tokens；T2 回填子会话 Agent run failed 零产物）。
    after_each: [current_draft_sync, rerun_t7]
    next: t7_5_integrity
  - id: t7_5_integrity
    phase: "T7.5 完整性门"
    phase_seq: 14
    kind: mechanical_checkpoint
    verdict_scale: four_tier   # v2.12.40：结论落四档；审计报告缺失 = 路径或参数错误（不触发修订）
    rerun_after_report: true   # v2.12.40「报告后激活」：前提 = 审计报告 + 本轮 M 门记录已落盘；不得用预跑/上轮记录
    owner: 主控
    write_authority: owner
    input: audits/审计报告-vN.md   # v2.12.41 修依赖倒置：本闸**不得**读 final/M-Gate-Report（那是本闸的**产出**；v2.12.33 已定「T7.5 不 check T8 产物」），改读本轮章节级 M 门记录（status.md）
    output: final/M-Gate-Report-*.json   # v2.12.41 补生产者：M 门报告由本闸汇总产出，供 T8 读（原全库无生产者 → 孤儿输入）
    next: g14_style_gate   # v2.12.40：G14 风格闸迁至此处（定稿前唯一一次）；原直连 phase4_4_figures
  - id: g14_style_gate   # 别名：文档层「Phase 4.4 前置（G14 风格闸）」（非独立 Phase 标签，主控呈现时归入 Phase 4.4）
    phase: "Phase 4.4 前置（G14 风格闸）"
    phase_seq: 15
    kind: agent
    verdict_scale: four_tier
    agent: G14
    role: G14
    write_authority: executor
    verification_authority: 主控
    on_worker_failure: {executor: 主控, disclosure: degraded_executor, retry_limit: 1}
    rerun_after_report: false   # v2.12.40 业主定案 A1：**全流程仅 1 次**；audit_revision.after_each 的 rerun_g14_if_enabled 已删
    # 执行前提（业主定案 A2：「T5 之前若有修订但还不能定稿，则 G14 还是不执行」）：
    #   本闸是**定稿前最后一道闸**。前置修订尚未收敛（audit_revision 未退出 / 仍有未决 P0·P1 修订项 / 尚不能定稿）
    #   → **不执行本闸**，先完成修订；只有进入「可定稿」状态才开闸。
    precondition: 已可定稿（前置修订已收敛：audit_revision 已退出且无未决 P0/P1 修订项）
    # 不再是可选项（业主定案「G14 不为可选功能」，替代原 `condition: g14_opt_in` 显式勾选）：
    #   适用性由 Phase 0「目标语言」字段**客观决定** —— 含中文 → 必跑；纯外语 → n/a（客观不适用，非「关闭」）。
    condition: target_language_includes_zh   # 命中定义：任务简报「目标语言」字段含中文（纯外语 = 不命中）
    on_not_triggered: record_not_triggered_in_status   # 纯外语 → n/a；未触发亦须入 status
    degrade: selfcheck_in_lite_tier   # 轻量档（2000-3000 字，口径真源 = 字数判定表.md）→ 内置自检，不 spawn
    exempt: owner_exempted_requires_disclosure   # 主人显式要求关闭 → 全项目不跑 + final/交付说明.md 披露
    input: drafts/current_draft.md
    output: audits/G14-检测报告-vN.md
    output_chars_max: 6000   # AI 痕迹检测报告
    on_fail: t5_style_revision   # 业主定案：G14 检查后由 T5 做**最后一次**修订（仅风格层，不得动论证/数据/引用）
    next: phase4_4_figures
  - id: t5_style_revision   # 别名：文档层「Phase 4.4 前置·风格修订」（G14 Fail 的唯一出口）
    phase: "Phase 4.4 前置·风格修订"
    phase_seq: 16
    kind: conditional_agent
    verdict_scale: four_tier
    rerun_after_report: true   # 前提 = G14 报告已落盘；必须在报告写入后取数
    agent: T5
    role: T5
    write_authority: executor
    verification_authority: 主控
    on_worker_failure: {executor: 主控, disclosure: degraded_executor, retry_limit: 1}
    input: drafts/current_draft.md + audits/G14-检测报告-vN.md
    output: drafts/初稿-v{N+1}.md + drafts/修订说明-v{N+1}.md
    condition: G14_requires_style_revision   # 命中定义：G14 判定 5+ 类 Fail（其余档位 = 不命中）
    on_not_triggered: record_not_triggered_in_status
    boundary: 仅风格层改动（10 类 AI 痕迹清单）；不得改动论证结构、数据、引用、结论
    after_each: [current_draft_sync]   # 修订后必须重刷 current_draft.md，供配图与定稿组装取用
    next: phase4_4_figures
  - id: phase4_4_figures   # 别名：文档层「Phase 4.4」
    phase: "Phase 4.4"
    phase_seq: 17
    verdict_scale: four_tier   # v2.12.40：图位数拍板与图件核验结论落四档
    input: drafts/current_draft.md + data/数据卡.md（图上数据源）
    kind: owner_agent
    agent: T0
    write_authority: owner
    output: final/图件/
    condition: figures_approved_by_owner   # 命中定义：Phase 2.5 大纲拍板记录的图位数 > 0（拍板 0 张 = 不命中）
    on_not_triggered: record_not_triggered_in_status   # v2.12.37 审计 P1-3：图位=0 时必须留痕，防「未触发」与「漏跑」不可分
    note: 主控亲为（不 spawn）：按 Phase 2.5 拍板数手写 SVG（templates/图表-SVG-template.md），零外发
    next: final_assembly
  - id: final_assembly   # 别名：文档层「Phase 4.4 后置」/ 定稿组装（非独立 Phase 标签，主控呈现时归入 Phase 4）
    phase: "Phase 4.4 后置（定稿组装）"
    phase_seq: 18
    input: drafts/current_draft.md + data/数据卡.md
    kind: mechanical_checkpoint
    verdict_scale: four_tier   # v2.12.40：组装前置核验结论落四档（当前稿不存在 = 路径或参数错误）
    rerun_after_report: true   # v2.12.40「报告后激活」：前提 = 当前权威稿已落盘；上游改写后必须重新组装
    owner: 主控
    write_authority: owner
    output: final/定稿.md
    note: 主控亲为（不 spawn）：把当前权威稿组装为 final/定稿.md（正文 + 图注对齐），供 T8 终检。v2.12.37 审计 P0-3：原「定稿组装」只写在散文（pipeline-overview / 主控卡），未入真源 → 续跑按 output 核对永远漏掉定稿。**v2.12.43 投稿域 vs 工程域**：本节点**只产投稿版**（纯学术结构），**禁**写入头部工程元数据段与「## 投稿就绪附录」段；工程信息一律由 t8_technical_final 写入 final/交付说明.md。禁入清单真源 = deliverables.md「投稿域 vs 工程域」
    next: t9_review
  - id: methodology_snapshot
    phase: "Phase 5 终检后置（方法论留档）"
    phase_seq: 21
    kind: owner_agent
    owner: 主控
    write_authority: owner
    input: status.md + final/交付说明.md
    output: run/<项目名>/audits/methodology-footprint-{项目名}.md
    condition: methodology_snapshot_opt_in
    verdict_scale: four_tier
    on_not_triggered: record_not_triggered_in_status
    note: "仅主人在 Phase 0 显式勾选方法论快照时新增；未勾选不创建。"
    next: phase5_acceptance
  - id: t9_review   # 别名：文档层「Phase 4.5」
    phase: "Phase 4.5"
    phase_seq: 19
    kind: advisory_agent
    verdict_scale: four_tier   # v2.12.40：T9 报告判定落四档
    # v2.12.40 业主定案 A2：输入由 `drafts/current_draft.md`（未定稿稿件）改为 **`final/定稿.md`（终稿）**——
    #   T9 定位为「**终稿落成后模拟投递刊物编辑审稿**」。节点位于 final_assembly 之后，故「终稿落成后」已满足。
    input: final/定稿.md
    condition: owner_peer_review_enabled   # 命中定义：主人已启用同行评审（仅靠 consent 判定；体裁仅供主人参考、非门控）。
                                # v2.12.46 口径修正：体裁不再机械门控，公众号亦可由主人显式开启。
                                # condition_definitions.owner_peer_review_enabled = requires owner_peer_review_consent。
    on_not_triggered: record_not_triggered_in_status   # v2.12.37 审计 P1-3：T9 关闭时必须留痕
    # blocking:false = T9 是「建议性同行评审」，其评分/期刊/扩写建议不阻塞交付（采纳权在主人）；
    # 但仍顺序排在 t8 之前，因 T8 终检需读 T9 报告做「T9 建议分流」（minor inline / major 呈主人拍板）。
    blocking: false
    role: T9
    write_authority: executor
    verification_authority: 主控
    on_worker_failure: {executor: 主控, disclosure: degraded_executor, retry_limit: 1}
    # ↓ v2.12.40 业主定案 A2：T9 独立性**硬定义**（不是建议、不得自行放宽）——错一处即报告失效
    independence: blind_review
    independence_rules:
      - 必须 spawn 为**独立子代理**（禁主控代笔；主控只做派发、收报告、落盘拼装）
      - 输入白名单**仅两项**：final/定稿.md + 任务简报「投稿信息」子集（目标期刊 / 栏目 / 字数上限）
      - 禁止读取内部过程材料（读取即独立性违反）：literature/文献卡.md、data/数据卡.md、cases/案例卡.md、
        analysis/分析大纲.md、analysis/批判报告-vN.md、audits/G14-检测报告-vN.md、audits/审计报告-vN.md、final/M-Gate-Report-*.json
      - 报告必须含必填字段「独立性声明」（声明未读上述任何材料 + 声明本文为盲审）
      - 评分与判定**不得引用任何内部报告**（引用即报告降为无效，必须重跑）
      - 不得以「参考 T7 的 G1 核验产物」为名回读内部报告（v2.12.40 删除了该旧口径）
    required_report_field: 独立性声明
    output: audits/审稿报告-vN.md
    output_chars_max: 15000
    next: t8_technical_final
  - id: t8_technical_final
    phase: "Phase 5 终检"
    phase_seq: 20
    verdict_scale: four_tier   # v2.12.40：终检结论落四档（通过/不通过/无法判定/路径或参数错误）
    rerun_after_report: true   # v2.12.40「报告后激活」：前提 = M-Gate-Report + T9 审稿报告均已落盘；不得用缺位时的推断值
    input: final/定稿.md + final/图件/*.svg + final/M-Gate-Report-*.json + audits/审稿报告-vN.md + audits/G14-检测报告-vN.md   # v2.12.37 审计 P1-2：T8 需读 T9 报告做「建议分流」；v2.12.41：G14 迁至 Phase 4.4 前置后，其报告核验职责由 T7 移交 T8
    kind: owner_agent
    agent: T8
    role: T8
    write_authority: owner
    verification_authority: 主控
    # v2.12.13（方案 3.1）：显式声明输入含 SVG 图件——SVG 嵌入文本孤儿检查已从 T7 移交 T8
    inputs: [final/图件/*.svg, final/定稿.md, final/交付说明.md]   # v2.12.41：原写 final/*.md 通配 → 改显式（通配使「被消费但无生产者」检查失明）
    output: final/交付说明.md
    output_chars_max: 10000
    next: methodology_snapshot
  - id: phase5_acceptance
    phase: "Phase 5 验收"
    phase_seq: 22
    kind: owner_checkpoint
    blocking: true        # v2.12.49：旧口径「不答 = 接受当前定稿」已删除 —— 静默不得记为 accepted
    owner_visible: true
    decisions: [accepted, revision_requested, restart_phase, deferred]
    timeout_fallback: pending_owner_halt
    terminal: accepted
